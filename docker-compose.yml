services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/carbonguard.db
      CARBONGUARD_ENVIRONMENT: production
      CARBONGUARD_CORS_ORIGINS: ${CARBONGUARD_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - "127.0.0.1:${CARBONGUARD_BACKEND_PORT:-8000}:8000"
    volumes:
      - carbonguard-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "127.0.0.1:${CARBONGUARD_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  carbonguard-data:
